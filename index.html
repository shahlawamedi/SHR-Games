<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kurdistan Drive CPM Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050b14; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .interactive { pointer-events: auto; }
        
        /* Menu */
        #menu { background: rgba(10, 15, 26, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: white; }
        .menu-card { background: #111827; padding: 25px; border-radius: 16px; border: 1px solid #38bdf8; width: 90%; max-width: 400px; text-align: center; }
        h1 { font-size: 24px; color: #38bdf8; margin-bottom: 5px; text-transform: uppercase; }
        select, button { width: 100%; padding: 14px; margin-top: 10px; border-radius: 10px; border: none; font-size: 15px; font-weight: bold; }
        select { background: #1f2937; color: white; border: 1px solid #374151; }
        button { background: #22c55e; color: white; cursor: pointer; }
        
        /* HUD & Touch Controls */
        #hud { display: none; justify-content: space-between; padding: 20px; color: white; font-weight: bold; }
        #speedometer { font-size: 26px; background: rgba(0,0,0,0.6); padding: 8px 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); }
        #touch-controls { display: none; position: absolute; bottom: 25px; left: 0; width: 100%; justify-content: space-between; padding: 0 25px; }
        .control-group { display: flex; gap: 12px; }
        .btn-touch { width: 70px; height: 70px; background: rgba(255,255,255,0.15); backdrop-filter: blur(5px); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; color: white; font-size: 22px; display: flex; align-items: center; justify-content: center; }
        .btn-touch:active { background: rgba(255,255,255,0.4); }
        
        #shop-prompt { display: none; position: absolute; top: 15%; left: 50%; transform: translateX(-50%); background: #111827; color: white; padding: 15px 25px; border-radius: 12px; border: 2px solid #22c55e; text-align: center; }
        #loading { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #38bdf8; font-weight: bold; font-size: 18px; }
    </style>
    <!-- Three.js + GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="loading" class="overlay">LOADING 3D ASSETS...</div>

    <!-- Main Menu -->
    <div id="menu" class="overlay interactive">
        <div class="menu-card">
            <h1>KURDISTAN DRIVE</h1>
            <p style="color: #94a3b8; font-size: 13px;">CPM Web Edition</p>
            
            <label style="display:block; text-align:left; margin-top:15px; font-size:11px; color:#94a3b8;">LOCATION</label>
            <select id="location-select">
                <option value="duhok">Duhok (City Highway & Ring)</option>
                <option value="amedi">Amedi (Mountain Cliffs)</option>
            </select>

            <label style="display:block; text-align:left; margin-top:10px; font-size:11px; color:#94a3b8;">CAR MODEL</label>
            <select id="car-select">
                <option value="sports">Sports Coupe (3D GLTF)</option>
                <option value="sedan">Sedan Classic (3D GLTF)</option>
                <option value="suv">4x4 SUV (3D GLTF)</option>
            </select>

            <button onclick="startGame()">DRIVE NOW</button>
        </div>
    </div>

    <!-- Gameplay HUD -->
    <div id="hud" class="overlay">
        <div>
            <span style="font-size: 11px; color: #aaa;">GARAGE DISTANCE</span>
            <div id="garage-dist" style="color:#22c55e; font-size:18px;">-- m</div>
        </div>
        <div id="speedometer">0 <span style="font-size: 14px;">KM/H</span></div>
    </div>

    <!-- Repair Shop UI Prompt -->
    <div id="shop-prompt" class="overlay interactive">
        <h3 style="color:#22c55e;">DUHOK / AMEDI REPAIR BAY</h3>
        <p style="font-size: 12px; color:#ccc; margin: 5px 0;">Vehicle service available.</p>
        <button onclick="repairVehicle()" style="background:#38bdf8; margin-top:5px; padding:8px 15px;">Repair Vehicle</button>
    </div>

    <!-- Touch Controls -->
    <div id="touch-controls" class="overlay interactive">
        <div class="control-group">
            <div class="btn-touch" id="btn-left">◄</div>
            <div class="btn-touch" id="btn-right">►</div>
        </div>
        <div class="control-group">
            <div class="btn-touch" id="btn-brake" style="background: rgba(239, 68, 68, 0.35);">B</div>
            <div class="btn-touch" id="btn-gas" style="background: rgba(34, 197, 94, 0.35);">A</div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, carMesh, terrain;
        let speed = 0, steering = 0;
        let inputs = { gas: false, brake: false, left: false, right: false };
        let isGameRunning = false;
        let audioCtx, osc;

        function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(50, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
            } catch(e){}
        }

        function updateAudio() {
            if (osc && audioCtx) {
                osc.frequency.setTargetAtTime(50 + Math.abs(speed) * 300, audioCtx.currentTime, 0.1);
            }
        }

        function initEngine() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xfff5ea, 1.2);
            sun.position.set(80, 150, 50);
            sun.castShadow = true;
            scene.add(sun);

            setupTouchEvents();
            window.addEventListener('resize', onWindowResize);
        }

        function buildEnvironment(loc) {
            if (terrain) scene.remove(terrain);
            const group = new THREE.Group();

            if (loc === 'duhok') {
                scene.background = new THREE.Color(0x7dd3fc);
                scene.fog = new THREE.FogExp2(0x7dd3fc, 0.003);

                // Grid road environment
                const grid = new THREE.GridHelper(1000, 100, 0x0284c7, 0x334155);
                grid.position.y = 0.01;
                group.add(grid);

                const groundGeo = new THREE.PlaneGeometry(1000, 1000);
                const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
                const ground = new THREE.Mesh(groundGeo, groundMat);
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;
                group.add(ground);
            } else {
                // Amedi cliff elevation
                scene.background = new THREE.Color(0x94a3b8);
                scene.fog = new THREE.FogExp2(0x94a3b8, 0.005);

                const groundGeo = new THREE.PlaneGeometry(800, 800, 20, 20);
                const groundMat = new THREE.MeshStandardMaterial({ color: 0x475569, wireframe: true });
                const ground = new THREE.Mesh(groundGeo, groundMat);
                ground.rotation.x = -Math.PI / 2;
                group.add(ground);
            }

            // Repair garage marker
            const garageGeo = new THREE.BoxGeometry(16, 8, 16);
            const garageMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, transparent: true, opacity: 0.5 });
            const garage = new THREE.Mesh(garageGeo, garageMat);
            garage.position.set(0, 4, -60);
            group.add(garage);

            terrain = group;
            scene.add(terrain);
        }

        function loadVehicleModel(type, callback) {
            document.getElementById('loading').style.display = 'block';
            
            // Fallback high-detail model construction if external GLTF fetch is delayed
            const carGroup = new THREE.Group();
            
            const loader = new THREE.GLTFLoader();
            // Open-source sample 3D vehicle GLTF model
            const modelUrl = 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/CesiumMilkTruck/glTF-Embedded/CesiumMilkTruck.gltf';

            loader.load(modelUrl, (gltf) => {
                document.getElementById('loading').style.display = 'none';
                const model = gltf.scene;
                model.scale.set(1.5, 1.5, 1.5);
                model.position.y = 0;
                carGroup.add(model);
                callback(carGroup);
            }, undefined, (error) => {
                // Procedural backup chassis
                document.getElementById('loading').style.display = 'none';
                const body = new THREE.Mesh(
                    new THREE.BoxGeometry(2, 1, 4.2),
                    new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.5, roughness: 0.2 })
                );
                body.position.y = 0.8;
                body.castShadow = true;
                carGroup.add(body);
                callback(carGroup);
            });
        }

        function startGame() {
            initAudio();
            const loc = document.getElementById('location-select').value;
            const carType = document.getElementById('car-select').value;

            document.getElementById('menu').style.display = 'none';

            buildEnvironment(loc);

            loadVehicleModel(carType, (loadedCar) => {
                if (carMesh) scene.remove(carMesh);
                carMesh = loadedCar;
                scene.add(carMesh);

                document.getElementById('hud').style.display = 'flex';
                document.getElementById('touch-controls').style.display = 'flex';
                isGameRunning = true;
                animate();
            });
        }

        function updatePhysics() {
            if (!isGameRunning || !carMesh) return;

            if (inputs.gas) speed = Math.min(speed + 0.02, 1.2);
            else if (inputs.brake) speed = Math.max(speed - 0.04, -0.3);
            else speed *= 0.98;

            if (inputs.left) steering = Math.min(steering + 0.05, 0.04);
            else if (inputs.right) steering = Math.max(steering - 0.05, -0.04);
            else steering *= 0.8;

            if (Math.abs(speed) > 0.01) {
                carMesh.rotation.y += steering * (speed > 0 ? 1 : -1);
            }

            carMesh.translateZ(speed);
            updateAudio();

            // Smooth chase camera
            const offset = new THREE.Vector3(0, 3.5, -9).applyMatrix4(carMesh.matrixWorld);
            camera.position.lerp(offset, 0.2);
            camera.lookAt(carMesh.position.x, carMesh.position.y + 1, carMesh.position.z);

            document.getElementById('speedometer').innerHTML = `${Math.round(Math.abs(speed) * 160)} <span style="font-size: 14px;">KM/H</span>`;

            // Distance to repair garage (0, 0, -60)
            const dist = Math.round(carMesh.position.distanceTo(new THREE.Vector3(0, 0, -60)));
            document.getElementById('garage-dist').innerText = `${dist} m`;

            if (dist < 15) {
                document.getElementById('shop-prompt').style.display = 'block';
            } else {
                document.getElementById('shop-prompt').style.display = 'none';
            }
        }

        function repairVehicle() {
            alert("Vehicle repaired!");
        }

        function setupTouchEvents() {
            const bind = (id, key) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); inputs[key] = true; }, {passive: false});
                el.addEventListener('touchend', (e) => { e.preventDefault(); inputs[key] = false; }, {passive: false});
            };
            bind('btn-gas', 'gas');
            bind('btn-brake', 'brake');
            bind('btn-left', 'left');
            bind('btn-right', 'right');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            if (!isGameRunning) return;
            requestAnimationFrame(animate);
            updatePhysics();
            renderer.render(scene, camera);
        }

        window.onload = initEngine;
    </script>
</body>
</html>
